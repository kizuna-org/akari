name: Foundation CI

on:
  push:
    branches:
      - main
      - codex/akari-foundation-redesign
  pull_request:
    branches:
      - main
      - 'codex/pr-*'

permissions:
  contents: read

jobs:
  all-status-check:
    runs-on: ubuntu-latest
    needs: [go, docker, browser]
    if: always()
    steps:
      - name: Require all foundation checks
        run: |
          test "${{ needs.go.result }}" = success
          test "${{ needs.docker.result }}" = success
          test "${{ needs.browser.result }}" = success

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: akari
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-golang
      - run: make generate
      - run: make lint
      - run: make test
      - run: make coverage
      - run: make build
      - run: make smoke
      - name: Verify no generated changes
        run: |
          git diff --exit-code
          git status --porcelain
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        with:
          name: foundation-coverage
          path: akari/coverage.out

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose config --quiet
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
        with:
          dockerfile: akari/Dockerfile
      - run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify host liveness
        run: curl --fail http://127.0.0.1:8080/healthz
      - name: Verify management boundary
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8082/api/status)
          test "$code" -eq 401
          token=$(docker compose exec -T akari cat /data/admin.token)
          curl --fail --silent -H "Authorization: Bearer $token" http://127.0.0.1:8082/api/docs > /dev/null
      - name: Verify state survives restart
        run: |
          before=$(docker compose exec -T akari sed -n 's/.*"sequence":\([0-9]*\).*/\1/p' /data/state.json)
          docker compose restart
          docker compose up -d --wait --no-build --no-recreate --wait-timeout 120
          after=$(docker compose exec -T akari sed -n 's/.*"sequence":\([0-9]*\).*/\1/p' /data/state.json)
          echo "restart persisted sequence $before -> $after"
          test "$after" -eq "$((before + 1))"
          curl --fail http://127.0.0.1:8080/healthz
      - name: Reject invalid configuration
        run: |
          if docker compose run --rm -e AKARI_ADDR=invalid akari; then
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop test deployment
        if: always()
        run: docker compose down

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-golang
      - run: make -C akari build
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: scripts/browser/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: scripts/browser
      - run: npx playwright install --with-deps chromium
        working-directory: scripts/browser
      - run: npm test
        working-directory: scripts/browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: console-browser-screenshots
          path: scripts/browser/artifacts
