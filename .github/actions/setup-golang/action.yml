name: Setup Golang
description: Set up the Go foundation toolchain

runs:
  using: composite
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version-file: akari/go.mod
        cache: false
    - name: Initialize module
      shell: bash
      working-directory: akari
      run: make init
