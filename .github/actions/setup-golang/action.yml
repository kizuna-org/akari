name: Setup Golang
description: Set up the Go foundation toolchain

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: akari/go.mod
        cache: false
    - name: Initialize module
      shell: bash
      working-directory: akari
      run: make init
