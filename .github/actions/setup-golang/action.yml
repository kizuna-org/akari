name: Setup Golang
description: Set up the Go foundation toolchain

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: akari/go.mod
        cache: false
    - name: Initialize module
      shell: bash
      working-directory: akari
      run: make init
