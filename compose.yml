name: akari-foundation

services:
  akari:
    build:
      context: .
      dockerfile: akari/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      AKARI_ADDR: ":8080"
      AKARI_DATA_DIR: "/data"
    ports:
      - "127.0.0.1:${AKARI_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    stop_grace_period: 15s
    volumes:
      - akari-data:/data
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  akari-data:
